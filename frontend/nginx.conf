upstream backend_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large CSV uploads (up to 256 MB).
    client_max_body_size 256m;

    # Same-origin API proxy: the SPA calls /api/..., nginx forwards to the
    # backend container (stripping the /api prefix). No CORS needed in prod.
    location /api/ {
        proxy_pass http://backend_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    # SPA fallback: any unknown path serves index.html (client routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets; never cache index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
